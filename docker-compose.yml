services:
  nabs-db:
    image: postgres:16-alpine
    container_name: nabs-postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nabs-redis:
    image: redis:7-alpine
    container_name: nabs-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nabs-core-api:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: nabs-api
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - git_repository_storage:/var/nabs/git_repo
      - sftpgo_uploads:/var/nabs/sftpgo_uploads
      - tls_certs:/var/nabs/tls          # GUI'den yüklenen web sunucu sertifikası
    # Host'ta çalışan Ollama'ya host.docker.internal ile erişim (Linux'ta gerekli;
    # Mac/Windows Docker Desktop'ta zaten çözülür ama zararsız).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nabs-db: { condition: service_healthy }
      nabs-redis: { condition: service_healthy }

  celery-worker-high:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: celery-worker-high
    command: celery -A app.workers.celery_app worker --loglevel=info -Q high-priority,default -c 4
    env_file: .env
    volumes:
      - git_repository_storage:/var/nabs/git_repo
      - sftpgo_uploads:/var/nabs/sftpgo_uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [nabs-redis]

  celery-beat:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: celery-beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on: [nabs-redis]

  nabs-dashboard:
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: nabs-dashboard
    ports: ["5173:80"]
    depends_on: [nabs-core-api]

  sftpgo:
    image: drakkan/sftpgo:v2.5-alpine
    container_name: sftpgo-gateway
    ports: ["2022:2022", "8080:8080"]
    env_file: .env
    volumes:
      - sftpgo_data:/var/lib/sftpgo
      - sftpgo_uploads:/var/nabs/sftpgo_uploads

volumes:
  postgres_data:
  git_repository_storage:
  sftpgo_data:
  sftpgo_uploads:
  tls_certs:

# Bölüm 11: Observability yığını (opsiyonel katman)
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: nabs-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    container_name: nabs-grafana
    ports: ["3000:3000"]
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: nabs-redis-exporter
    environment:
      REDIS_ADDR: redis://nabs-redis:6379
    ports: ["9121:9121"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nabs-pg-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@nabs-db:5432/${POSTGRES_DB}?sslmode=disable"
    ports: ["9187:9187"]

  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: nabs-celery-exporter
    command: ["--broker-url=redis://nabs-redis:6379/0"]
    ports: ["9808:9808"]

volumes:
  grafana_data:

# Opsiyonel: gömülü HashiCorp Vault (kendi Vault'u olmayan kurumlar için).
# Kalıcı depolamalı, üretim-yetkin tek düğüm. Kullanmadan önce PRODUCTION_INSTALL
# Bölüm "Opsiyonel: gömülü Vault"u okuyun — Vault init + unseal gerektirir.
#
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.vault.yml up -d nabs-vault
#   ./scripts/vault_init.sh          # ilk kurulum: init + unseal + secret yazma
#   # .env'de VAULT_ADDR/VAULT_TOKEN'ı ayarlayıp tüm stack'i başlatın:
#   docker compose -f docker-compose.yml -f docker-compose.vault.yml up -d
services:
  # Tek seferlik hazırlık: raft veri dizininin sahipliğini düzeltir.
  # Vault konteyner içinde root olmayan 'vault' kullanıcısı olarak çalışır; yeni
  # bir Docker volume'ü ise root'a ait oluşturulur. İmaj /vault/file ve
  # /vault/logs'u hazırlar ama raft'ın kullandığı /vault/data'yı hazırlamaz;
  # düzeltilmezse Vault "open /vault/data/vault.db: permission denied" ile çıkar
  # ve sonsuz restart döngüsüne girer.
  # Aynı imaj kullanılıyor ki 'vault' kullanıcısının uid'i ne olursa olsun doğru
  # çözümlensin ve fazladan imaj indirilmesin.
  nabs-vault-init:
    image: hashicorp/vault:1.17
    container_name: nabs-vault-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /vault/data && chown -R vault:vault /vault/data && chmod 700 /vault/data && echo 'vault veri dizini hazir'"]
    volumes:
      - vault_data:/vault/data
    restart: "no"

  nabs-vault:
    image: hashicorp/vault:1.17
    container_name: nabs-vault
    # DİKKAT: burada "-config=..." VERMEYİN. Resmî imajın entrypoint'i "server"
    # argümanını görünce komutu şuna çevirir:
    #     vault server -config=/vault/config ... "$@"
    # Yani /vault/config dizinini zaten yükler. Ayrıca -config=/vault/config/config.hcl
    # verilirse aynı dosya İKİ KEZ okunur, iki adet listener tanımlanır ve Vault
    # "listen tcp4 0.0.0.0:8200: bind: address already in use" ile açılmaz.
    command: server
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vault_data:/vault/data
      - ./deploy/vault/config.hcl:/vault/config/config.hcl:ro
    ports:
      - "127.0.0.1:8200:8200"   # yalnızca host içi; Vault dışarıya açılmaz
    restart: unless-stopped
    depends_on:
      nabs-vault-init:
        condition: service_completed_successfully
    healthcheck:
      # vault status çıkış kodları: 0 = unsealed, 2 = sealed, 1 = erişilemiyor.
      # 0 ve 2 "ayakta" sayılır (sealed Vault da ayaktadır, sadece kilitlidir).
      # NOT: $$ compose'un değişken interpolasyonundan kaçmak için gerekli.
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; s=$$?; [ $$s -eq 0 ] || [ $$s -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # API ve worker'lar Vault'a bağlanabilsin (aynı ağ). VAULT_* .env'den okunur.
  nabs-core-api:
    depends_on:
      nabs-vault:
        condition: service_started

volumes:
  vault_data:
